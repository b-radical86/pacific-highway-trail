[project]
name = "pacific-highway-trail"
version = "0.1.0"
description = "Pacific Highway Trail - Modular Dual-Cartridge Trail Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "google-genai>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "BLE001", "S110", "B904"]
